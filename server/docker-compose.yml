services:
  mysql:
    image: mysql:8.4
    container_name: hertz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-hertz_benin}
      MYSQL_USER: ${DB_USER:-hertz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hertz}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - hertz-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  hertz-mysql-data:
